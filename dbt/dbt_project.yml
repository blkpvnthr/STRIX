name: strix_transform
version: "0.3.0"
config-version: 2

# The profile is generated by `strix transform init` into this directory
# (dbt/profiles.yml, gitignored) from profiles.example.yml with the resolved
# warehouse path. DBT_PROFILES_DIR is set to the project dir by the CLI.
profile: strix

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Warehouse facts/dimensions live in the DuckDB catalog's `main` schema; the
# source database defaults to target.database (the attached warehouse file).
# Marts/intermediate/staging are materialized into dedicated schemas so research
# queries and the independent verifier can target the published layer explicitly.
models:
  strix_transform:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  strix_transform:
    +schema: seeds

# Surface the warehouse load provenance to every model via a var so marts can
# stamp the silver_publication_id set they were built from.
vars:
  strix_calc_methodology_version: "1.0.0"
  # Statistical tolerance (absolute) used by cross-validation between the SQL
  # marts and the independent Decimal Python calculators.
  strix_stat_tolerance: 0.0000005
