[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strix"
version = "0.3.0.dev0"
description = "STRIX — Structured Traceability, Retrieval, and Intelligence eXtraction. Evidence-grounded research CLI (synthetic demonstration)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BLKPVNTHR" }]
dependencies = [
    "pydantic>=2.5",
    # OpenAI research agent (Responses API). 1.66+ ships responses.create.
    "openai>=1.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Controlled HTTP retrieval for scholarly acquisition (strix.corpus.acquisition).
# Kept optional per the project's document-dependency isolation rule; also
# listed under dev so the test suite (which only ever uses httpx.MockTransport,
# never a real socket) can run.
acquisition = [
    "httpx>=0.27",
]
# Data lakehouse: Silver normalization to partitioned Parquet (DE-3+).
lakehouse = [
    "pyarrow>=16",
    "defusedxml>=0.7",
]
# Web interface: FastAPI Research API + SSE progress (Phase 5).
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[project.scripts]
strix = "strix.cli:main"
strix-service = "strix.service:serve"
strix-demo-fixture = "strix.market.fixture:main"
strix-agent-diagnostics = "strix.agent.diagnostics:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Deliberate Unicode-lookalike run IDs prove the ASCII-only regex holds.
"tests/test_run_store.py" = ["RUF001"]
# Deliberate full-width Latin characters prove NFKC normalization folds them.
"tests/research/test_research_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["strix"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

# Third-party libraries without type stubs (lakehouse Silver layer).
[[tool.mypy.overrides]]
module = ["pyarrow.*", "defusedxml.*"]
ignore_missing_imports = true
