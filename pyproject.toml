[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strix"
version = "0.3.0.dev0"
description = "STRIX — Structured Traceability, Retrieval, and Intelligence eXtraction. Evidence-grounded research CLI (synthetic demonstration)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BLKPVNTHR" }]
dependencies = [
    "pydantic>=2.5",
    # OpenAI research agent (Responses API). 1.66+ ships responses.create.
    "openai>=1.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyarrow-stubs==20.0.0.20260819",
    "httpx>=0.27",
    # Property-based falsification testing of mathematical invariants
    # (effective-independence bounds, admission-algebra monotonicity, bitemporal
    # leak-freedom). Development-only; never imported by src/strix at runtime.
    "hypothesis>=6.100",
]
# Formal reasoning layer (compositional evidence calculus, §R-N3). z3-solver backs
# the optional SAT/UNSAT entailment check for the small formally-representable
# conclusion fragment ONLY. It is isolated behind a typed interface + feature flag:
# a missing solver, a solver timeout, or a solver UNKNOWN result can never admit a
# conclusion — it degrades to the deterministic reference checker and, failing that,
# to UNKNOWN (abstain). z3 is MIT-licensed.
formal = [
    "z3-solver>=4.12",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Controlled HTTP retrieval for scholarly acquisition (strix.corpus.acquisition).
# Kept optional per the project's document-dependency isolation rule; also
# listed under dev so the test suite (which only ever uses httpx.MockTransport,
# never a real socket) can run.
acquisition = [
    "httpx>=0.27",
]
# Data lakehouse: Silver normalization to partitioned Parquet (DE-3+).
lakehouse = [
    "pyarrow>=16",
    "defusedxml>=0.7",
    "duckdb>=1.0",
]
# Cloud/hosted deployment: Supabase Auth JWT verification (asymmetric JWKS +
# legacy HS256) and the durable Supabase/Postgres job store. Kept optional per the
# project's dependency-isolation rule; the local app runs without these.
cloud = [
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
]
# Optional Snowflake cloud warehouse target (DE-4); not required for local dev.
snowflake = [
    "snowflake-connector-python>=3.0",
]
# dbt transformation layer (DE-5). DuckDB adapter is operational; dbt-snowflake is
# optional. pathspec is pinned to satisfy both dbt-core (<1.1) and mypy (>=1.0).
dbt = [
    "dbt-core>=1.11,<1.13",
    "dbt-duckdb>=1.9,<1.12",
    "pathspec>=1.0,<1.1",
]
# Optional dbt Snowflake adapter (offline-compiled; live run needs credentials).
dbt-snowflake = [
    "dbt-snowflake>=1.9,<1.13",
]
# Web interface: FastAPI Research API + SSE progress (Phase 5).
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[project.scripts]
strix = "strix.cli:main"
strix-service = "strix.service:serve"
strix-demo-fixture = "strix.market.fixture:main"
strix-agent-diagnostics = "strix.agent.diagnostics:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Deliberate Unicode-lookalike run IDs prove the ASCII-only regex holds.
"tests/test_run_store.py" = ["RUF001"]
# Deliberate full-width Latin characters prove NFKC normalization folds them.
"tests/research/test_research_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["strix"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

# Third-party libraries without type stubs (lakehouse Silver layer + optional
# formal-reasoning solver). z3 is imported only behind the typed interface in
# evidence_graph/inference.py and is never a hard runtime dependency of the core.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "defusedxml.*", "duckdb.*", "snowflake.*", "z3.*"]
ignore_missing_imports = true
