site_name: STRIX
site_description: >-
  STRIX — Structured Traceability, Retrieval, and Intelligence eXtraction.
  Evidence-grounded research CLI with verifiable source-to-claim lineage.
site_url: ""
use_directory_urls: true
docs_dir: architecture

theme:
  name: material
  font: false
  icon:
    logo: material/owl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Requirements: getting-started/requirements.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: overview.md
      - Execution flow: execution-flow.md
      - Evidence model: evidence-model.md
      - Provenance: provenance.md
      - Deterministic boundary: deterministic-boundary.md
      - LLM boundary: llm-boundary.md
      - Storage: storage.md
      - Security: security.md
  - Usage:
      - Interactive mode: usage/interactive-mode.md
      - Command reference: usage/command-reference.md
      - Research runs: usage/research-runs.md
      - Replay: usage/replay.md
      - Interpreting results: usage/interpreting-results.md
  - Development:
      - Project structure: development/project-structure.md
      - Testing: development/testing.md
      - Adding connectors: development/adding-connectors.md
      - Adding calculations: development/adding-calculations.md
      - Adding reasoners: development/adding-reasoners.md
      - Roadmap: development/roadmap.md
      - Neuro-symbolic platform: development/neuro-symbolic-platform.md
  - Reference:
      - Data models: reference/data-models.md
      - Artifact formats: reference/artifact-formats.md
      - Environment variables: reference/environment-variables.md
      - Glossary: reference/glossary.md
