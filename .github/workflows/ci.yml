name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lakehouse,cloud]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Pytest (full regression suite)
        run: pytest -o addopts="" -q
      - name: API import + route-protection smoke
        run: |
          python - <<'PY'
          from strix.webapi.app import create_app
          from strix.auth.dependencies import require_user
          app = create_app()
          paths = {getattr(r, "path", "") for r in app.routes}
          required = {"/api/health", "/api/research", "/api/finance/accounts", "/api/finance/net-worth"}
          missing = required - paths
          assert not missing, f"missing routes: {missing}"
          # Every /api route except the public health/meta must require authentication.
          public = {"/api/health", "/api/meta"}
          for route in app.routes:
              path = getattr(route, "path", "")
              if path.startswith("/api") and path not in public:
                  deps = getattr(route, "dependencies", [])
                  assert any(getattr(d, "dependency", None) is require_user for d in deps), (
                      f"route {path} is not auth-protected"
                  )
          print("API OK:", len([p for p in paths if p.startswith('/api')]), "api routes; auth enforced")
          PY

  frontend:
    name: Frontend (vitest · tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vitest (component + unit tests)
        run: npm run test
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  migrations:
    name: Supabase migration syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert migrations are present and ordered
        run: |
          ls supabase/migrations/*.sql
          test -f supabase/migrations/0001_research_jobs.sql
          test -f supabase/migrations/0002_storage.sql
