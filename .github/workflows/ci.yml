name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lakehouse]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check + production build
        run: npm run build

  api-smoke:
    name: API import + route smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install function deps (mirrors Vercel)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import ASGI app and assert routes (no heavy deps)
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path("src").resolve()))
          sys.path.insert(0, str(pathlib.Path("api").resolve()))
          import index
          paths = {r.path for r in index.app.routes if getattr(r, "path", "").startswith("/api")}
          required = {"/api/health", "/api/research", "/api/jobs/execute", "/api/jobs/sweep"}
          missing = required - paths
          assert not missing, f"missing routes: {missing}"
          print("API import OK:", len(paths), "routes")
          PY
